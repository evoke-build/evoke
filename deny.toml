# The dependency audit, run by: bin/dx mise run lint (cargo deny check). Adding a dependency is an owner decision.
[graph]
all-features = true

[advisories]
yanked = "deny"

# Apache-2.0 and MIT, plus what the listed dependencies carry: ISC (ring, rustls-webpki, untrusted),
# BSD-3-Clause (subtle), Unicode-3.0 (unicode-ident, behind serde's derive), CDLA-Permissive-2.0 (webpki-roots, the
# root certificates ureq trusts), BSL-1.0 (clipboard-win and error-code, rustyline's Windows clipboard, never built
# here).
[licenses]
allow                  = ["Apache-2.0", "MIT", "ISC", "BSD-3-Clause", "Unicode-3.0", "CDLA-Permissive-2.0", "BSL-1.0"]
confidence-threshold   = 0.9
unused-allowed-license = "allow"

[bans]
multiple-versions    = "warn"
wildcards            = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git      = "deny"
