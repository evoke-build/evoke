# The Rust workspace: four crates, edges pointing one way — evoke and evoke-wasm → evoke-adapters → evoke-core.
# Nothing here is published in v1.
[workspace]
resolver = "3"
members  = ["crates/evoke-core", "crates/evoke-adapters", "crates/evoke-wasm", "crates/evoke"]

[workspace.package]
version    = "0.1.0"
edition    = "2024"
license    = "Apache-2.0"
repository = "https://github.com/evoke-build/evoke"
publish    = false

# Every dependency is pinned once here; Cargo.lock holds the exact versions. Adding one is an owner decision: it
# replaces code that would be worse hand-written, and is pure where the core is pure. Why each:
#   indexmap               file order for options, examples and words — prompts and the classifier see it
#   libc                   killpg: the process group, not the child alone
#   rustyline              the REPL's line editing and history; it opens /dev/tty itself
#   serde, serde_json      every boundary type is JSON-shaped; the wire keeps a JSON document's order
#   sha2                   h1, the trust digest, the plan digest, the cache's file names
#   toml_edit              one spanned TOML reader for both hosts; format-preserving edits in the CLI
#   unicode-normalization  NFC for utterance identity
#   ureq                   blocking HTTP over a kept-alive agent; rustls, so a static binary
[workspace.dependencies]
evoke-core            = { path = "crates/evoke-core" }
evoke-adapters        = { path = "crates/evoke-adapters" }
indexmap              = { version = "2.14.2", features = ["serde"] }
libc                  = "0.2.189"
rustyline             = { version = "18.0.1", default-features = false, features = ["with-file-history"] }
serde                 = { version = "1.0.229", features = ["derive"] }
serde_json            = { version = "1.0.151", features = ["preserve_order"] }
sha2                  = "0.11.0"
toml_edit             = { version = "0.25.15", default-features = false, features = ["parse"] }
unicode-normalization = "0.1.25"
ureq                  = { version = "3.4.2", default-features = false, features = ["rustls"] }

# The SDK's core.wasm: small over fast, one unit, a panic aborting — a trap the loader reports as a bug.
[profile.wasm]
inherits      = "release"
opt-level     = "s"
lto           = true
codegen-units = 1
panic         = "abort"
strip         = true

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = "warn"
