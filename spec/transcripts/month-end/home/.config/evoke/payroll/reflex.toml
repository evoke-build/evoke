reflex = 1

description = """
Show a month's payroll run.
The salaries, taxes and total of a run already made. It pays no one."""
not_for = [
  "running payroll or paying salaries",
  "one person's payslip",
  "adding someone to payroll or changing a salary",
]
tags = ["payroll", "close"]
effect = "read"
confirm = "Show {month}'s payroll run?"
run = "payroll.mts"
returns = "payroll"

[args.month]
ask   = "Which month?"
vocab = "months"

[examples]
"show september's payroll"                 = {}
"what did payroll cost in august"          = {}
"payroll breakdown for october"            = {}
"payroll taxes for september"              = {}
"how much was payroll in october"          = {}
"how much did the salaries cost in august" = {}

[tests]
"october's wage bill"               = {}
"gross pay for september"           = {}
"pay everyone their october salary" = false
"ana's payslip for august"          = false
"put maria on payroll from october" = false
