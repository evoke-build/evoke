reflex = 1

description = """
List a month's invoices.
What was billed to customers that month, and which invoices are paid."""
not_for = [
  "sending, creating or chasing an invoice",
  "bills that suppliers send us",
  "money that came into the bank",
  "receipts for card charges",
]
tags = ["invoices", "close"]
effect = "read"
confirm = "List {month}'s invoices?"
run = "invoices.mts"
returns = "invoices"

[args.month]
ask   = "Which month?"
vocab = "months"

[examples]
"list september's invoices"                 = {}
"which invoices went out in august"         = {}
"invoices for october"                      = {}
"how many of september's invoices are paid" = {}
"what did we bill customers in august"      = {}

[tests]
"show the invoices we issued in october"         = {}
"what's still unpaid from august's billing"      = {}
"send acme their invoice for september"          = false
"what do we owe our vendors for october"         = false
"deposits into the business account in august"   = false
"where's the receipt for october's hotel charge" = false
