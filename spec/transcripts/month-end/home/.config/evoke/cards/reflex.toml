reflex = 1

description = """
List a month's company card expenses.
Every charge on the company cards, and which of them lack a receipt."""
not_for = [
  "debits on the business account",
  "salaries and wages",
  "out-of-pocket costs to pay back",
  "freezing a card or ordering a new one",
]
tags = ["cards", "close"]
effect = "read"
confirm = "List {month}'s card expenses?"
run = "cards.mts"
returns = "expenses"

[args.month]
ask   = "Which month?"
vocab = "months"

[examples]
"card expenses for september"                     = {}
"what did we spend on cards in august"            = {}
"pull the october card charges"                   = {}
"which card charges in september have no receipt" = {}
"company card spend for october"                  = {}

[tests]
"show august's charges on the corporate cards"          = {}
"the corporate card statement for september"            = {}
"what left our current account in september"            = false
"how much did we pay in wages in october"               = false
"reimburse sam for the train tickets he bought himself" = false
"freeze the card that went missing"                     = false
