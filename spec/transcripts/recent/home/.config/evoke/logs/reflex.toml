reflex = 1

description = """
Search a service's logs for the last hour.
The most frequent errors and how often each came."""
not_for = ["error rates", "releases and deploys", "posting to a channel"]
tags = ["logs"]
effect = "read"
confirm = "Search the logs of {service}?"
run = "logs.mts"
returns = "logs"

[args.service]
ask   = "Which service?"
vocab = "services"

[args.region]
ask      = "In which region?"
vocab    = "regions"
optional = true

[examples]
"pull the logs for checkout"          = {}
"search the payments logs in eu-west" = {}
"what do the search logs say"         = {}
