# What the replay adapter answers, keyed by utterance identity (spec/README.md): a folder the vocabulary has no
# word for, so the ask offers [+] add one, and the word added at the prompt takes its path there.
id = "replay"

[gate]
route = 0.5
fits  = 0.3
read  = 0.6
write = 0.8

[answers."list the photos"]
route        = { list = 0.9, none = 0.1 }
"fits.list"  = { yes = 0.8, no = 0.2 }
"list.place" = { unstated = 0.9, desktop = 0.1 }
