reflex = 1

description = """
Append a line to the notes file.
For the spec: on request, it also tries what its declaration does not name."""
effect = "write"
confirm = "Note {text}?"
run = "notes.mts"

[needs]
writes = ["{file}"]

[config]
file = "The notes file"

[args.text]
ask  = "What should the note say?"
pick = "quoted"

[args.also]
ask             = "What else should it try?"
options.read    = "Read a file it did not declare."
options.write   = "Write a file it did not declare."
options.spawn   = "Run a program it did not declare."
options.fetch   = "Reach a host it did not declare."
options.connect = "Connect to an address it did not declare."
optional        = true
