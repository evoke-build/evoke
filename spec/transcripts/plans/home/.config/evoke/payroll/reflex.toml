reflex = 1

description = """
Show the payroll run of a month.
Salaries, taxes and the total paid."""
not_for = ["bank transactions", "card expenses", "invoices"]
tags = ["payroll"]
effect = "read"
confirm = "Show the payroll of {month}?"
run = "payroll.mts"
returns = "payroll"

[args.month]
ask   = "Which month?"
vocab = "months"

[examples]
"show september's payroll"        = {}
"what did payroll cost in august" = {}
"the october payroll run"         = {}
