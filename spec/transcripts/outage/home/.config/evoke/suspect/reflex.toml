reflex = 1

description = """
Find the release most likely behind a failure.
Weighs the errors, deploys and logs found before it in the same request, and names one release."""
not_for = ["listing a service's deploys", "rolling the release back", "who shipped a release"]
tags = ["suspect", "outage"]
effect = "read"
confirm = "Find the release behind the failure?"
run = "suspect.mts"

[args.errors]
takes = "errors"

[args.deploys]
takes = "deploys"

[args.logs]
takes = "logs"

[yields]
release = "code"

[examples]
"find the suspect"                   = {}
"which deploy broke it"              = {}
"find the release behind the outage" = {}
"what release caused this"           = {}
"find the release to blame"          = {}

[tests]
"pin down the bad release"              = {}
"pull the bad release off search"       = false
"every payments release from this week" = false
