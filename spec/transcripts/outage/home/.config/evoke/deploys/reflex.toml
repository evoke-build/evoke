reflex = 1

description = """
List the recent deploys of a service.
Each release with when it went out and who shipped it, in one region or all."""
not_for = ["rolling back a deploy", "which deploy broke something", "shipping a new release"]
tags = ["deploys", "outage"]
effect = "read"
confirm = "List the deploys of {service}?"
run = "deploys.mts"
returns = "deploys"

[args.service]
ask   = "Which service?"
vocab = "services"

[args.region]
ask      = "In which region?"
vocab    = "regions"
optional = true

[yields]
deploys = { each = { release = "code" } }

[examples]
"what got deployed to checkout recently" = {}
"list the deploys of payments"           = {}
"recent releases of search in us-east"   = {}
"who shipped to payments in eu-west"     = {}
"what went out on checkout"              = {}
"who released payments last"             = {}
"show the deploys of search in us east"  = {}

[tests]
"show the deploy log for search"          = {}
"take checkout off its latest deploy"     = false
"is the newest payments release to blame" = false
"push 4.13.0 out to checkout"             = false
