# What the replay adapter answers, keyed by utterance identity (spec/README.md): the two lines the manual's
# first-reflex page shows, decided in a project that holds the one reflex.
id = "replay"

[gate]
route = 0.5
fits  = 0.3
read  = 0.6
write = 0.8

[answers.'say hi to "Ada"']
route        = { hello = 0.94, none = 0.06 }
"fits.hello" = { yes = 0.71 }
"hello.who"  = { "11-14" = 0.97, unstated = 0.03 }

[answers.'wave at "Grace"']
route        = { hello = 0.92, none = 0.08 }
"fits.hello" = { yes = 0.7 }
"hello.who"  = { "9-14" = 0.95, unstated = 0.05 }
