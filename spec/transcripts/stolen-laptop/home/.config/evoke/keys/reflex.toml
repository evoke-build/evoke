reflex = 1

description = """
List a person's API keys in the key store.
Each key's name and when it was created; no key changes."""
not_for = ["rotating or replacing keys", "a person's saved passwords", "SSH keys on this computer", "house or car keys"]
tags = ["keys", "stolen"]
effect = "read"
confirm = "List {person}'s API keys?"
run = "keys.mts"
returns = "keys"

[args.person]
ask   = "Which colleague's API keys?"
vocab = "people"

[examples]
"show jo's keys"             = {}
"which keys does ana hold"   = {}
"every api key sam has"      = {}
"jo's keys in the key store" = {}

[tests]
"when was sam's deploy key made"              = {}
"sam's tokens for our api"                    = {}
"swap out jo's credentials"                   = false
"show me ana's passwords"                     = false
"which ssh identities does this machine hold" = false
"where did I leave my car keys"               = false
