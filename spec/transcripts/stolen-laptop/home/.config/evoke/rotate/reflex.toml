reflex = 1

description = """
Rotate a person's API keys.
Each key found for them is replaced by a new one; the old ones stop working."""
not_for = [
  "revoking a person's sessions",
  "listing a person's API keys",
  "resetting a person's password",
  "rotating the screen or a photo",
]
tags = ["rotate", "stolen"]
effect = "write"
confirm = "Rotate the keys?"
run = "rotate.mts"

[args.keys]
takes = "keys"

[examples]
"rotate the keys"                = {}
"rotate their api keys"          = {}
"replace the keys with new ones" = {}
"issue them fresh api keys"      = {}

[tests]
"cycle those credentials"      = {}
"roll over their keys"         = {}
"terminate sam's sessions"     = false
"count the keys jo owns"       = false
"give jo a new password"       = false
"rotate my screen to portrait" = false
