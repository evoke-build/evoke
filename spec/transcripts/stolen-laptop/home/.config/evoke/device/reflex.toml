reflex = 1

description = """
Find a person's laptop in device management.
Its serial, its model and when it last checked in; nothing on the laptop changes."""
not_for = ["where a person is signed in", "a person's API keys", "locking or wiping a laptop", "ordering a new laptop"]
tags = ["device", "stolen"]
effect = "read"
confirm = "Find {person}'s laptop?"
run = "device.mts"
returns = "device"

[args.person]
ask   = "Which colleague's laptop?"
vocab = "people"

[yields]
serial = "code"

[examples]
"find sam's laptop"                        = {}
"when did ana's laptop last check in"      = {}
"look up jo's device"                      = {}
"get me the serial of sam's work computer" = {}

[tests]
"which model of laptop does ana use"    = {}
"what hardware does jo have"            = {}
"is sam connected to the vpn right now" = false
"find jo's tokens"                      = false
"disable ana's laptop remotely"         = false
"buy sam a new laptop"                  = false
