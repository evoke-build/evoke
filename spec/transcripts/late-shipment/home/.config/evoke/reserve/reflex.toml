reflex = 1

description = """
Set aside what we hold of one product code for the orders waiting on it.
Held until the shipment lands; nothing is bought."""
not_for = ["buying from a supplier", "checking the stock", "working out the shortfall"]
tags = ["reserve"]
effect = "write"
confirm = "Reserve {sku}?"
run = "reserve.mts"

[args.sku]
ask  = "Which product code?"
pick = "code"

[examples]
"reserve VX-221004"                               = { sku = "VX-221004" }
"hold the stock of HS-040902 for the open orders" = { sku = "HS-040902" }
"put VX-221411 aside"                             = { sku = "VX-221411" }
