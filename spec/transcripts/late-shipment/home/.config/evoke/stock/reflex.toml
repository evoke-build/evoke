reflex = 1

description = """
Check the warehouse stock of a shipment's products.
The units on hand of each product code on the shipment, counted now; nothing is set aside or ordered."""
not_for = [
  "where a shipment is or when it lands",
  "setting units aside for waiting orders",
  "what a late shipment leaves us short of",
  "restocking from a supplier",
  "share prices on the stock market",
  "prices other suppliers would charge",
]
tags = ["stock", "late"]
effect = "read"
confirm = "Check the warehouse stock for the {shipment} shipment?"
run = "stock.mts"
returns = "stock"

[args.shipment]
ask   = "Which shipment?"
vocab = "shipments"

[examples]
"stock check on the antwerp container's products"            = {}
"inventory for what the hamburg pallets bring"               = {}
"our stock levels for everything on the rotterdam container" = {}
"how well stocked are we for the hamburg pallets"            = {}
"check the stock for the rotterdam container"                = {}
"how much do we have of what is on the hamburg pallets"      = {}

[tests]
"warehouse figures for the rotterdam items"             = {}
"how much do we have on hand"                           = {}
"is the hamburg container due in soon"                  = false
"block off HS-040911 for the pending sales orders"      = false
"what will run out while rotterdam is held up"          = false
"restock HS-0409 through baltic"                        = false
"how are our shares trading on the exchange"            = false
"what would other vendors charge for the hamburg goods" = false
