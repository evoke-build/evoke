reflex = 1

description = """
Show the meetings on your calendar for a day.
Each meeting's title and time; nothing on the calendar changes."""
not_for = ["moving meetings to another day", "adding a meeting or an event", "asking what the date is"]
tags = ["calendar", "cancelled"]
effect = "read"
confirm = "Show the calendar for {day}?"
run = "calendar.mts"
returns = "calendar"

[args.day]
ask  = "Which day?"
pick = "date"

[examples]
"which meetings fall on thursday"        = { day = "thursday" }
"my calendar for the day after tomorrow" = { day = "the day after tomorrow" }
"show my schedule for this monday"       = { day = "this monday" }
"how does today look on my calendar"     = { day = "today" }
"show my calendar for tomorrow"          = { day = "tomorrow" }
"what meetings do I have on friday"      = { day = "friday" }

[tests]
"any calls lined up for friday"    = { day = "friday" }
"agenda for the 21st"              = { day = "the 21st" }
"pull up my diary"                 = { day = false }
"push wednesday's calls to monday" = false
"set up lunch with ana on friday"  = false
"which day of the month are we on" = false
