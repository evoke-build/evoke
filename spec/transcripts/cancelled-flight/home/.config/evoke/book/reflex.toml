reflex = 1

description = """
Book a seat on a flight by its code.
The fare is charged to the travel account and the ticket goes to your inbox; there is no undo."""
not_for = [
  "finding flights to a city",
  "booking the hotel",
  "cancelling a booked flight",
  "checking in for a flight",
  "telling a channel about a booking",
]
tags = ["book", "cancelled"]
effect = "destructive"
confirm = "Book {flight}?"
run = "book.mts"

[args.flight]
ask  = "What is the flight's code?"
pick = "code"

[examples]
"book me onto LX1830"     = { flight = "LX1830" }
"buy a ticket on FR8342"  = { flight = "FR8342" }
"rebook me on tp1051"     = { flight = "tp1051" }
"book flight LX1830"      = { flight = "LX1830" }
"get me a seat on TP1051" = { flight = "TP1051" }

[tests]
"reserve IB3107 please"               = { flight = "IB3107" }
"reserve a seat on the earlier plane" = { flight = false }
"cancel TP1043"                       = false
"check me in on AZ0611"               = false
"which planes leave for berlin"       = false
"reserve a night at that guesthouse"  = false
"ping #travel that i'm on KL1776 now" = false
