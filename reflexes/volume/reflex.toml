reflex = 1

description = """
Set the output volume to a percentage.
From 0, silent, to 100, for everything the laptop plays."""

not_for = [
  "muting or unmuting",
  "turning it up or down by an amount",
  "one app's volume",
  "changing the screen brightness",
  "asking what the volume is",
]
tags = ["sound"]
effect = "write"
confirm = "Set the volume to {level}?"
run = "volume.mts"
platforms = ["macos"]

[needs]
runs = ["osascript"]

[args.level]
ask   = "How loud, in percent?"
pick  = "number"
range = [0, 100]

[examples]
"set the volume to 35 percent"  = { level = "35 percent" }
"volume 60%"                    = { level = "60%" }
"bring the sound up to seventy" = { level = "seventy" }
"drop the volume to 20 percent" = { level = "20 percent" }
"set the volume to 40"          = { level = "40" }
"turn the sound down to 10"     = { level = "10" }
"mute the sound"                = false

[tests]
"put the volume at 100 percent"         = { level = "100 percent" }
"make the speakers twenty five percent" = { level = "twenty five percent" }
"lower the volume a little"             = { level = false }
"unmute my speakers"                    = false
"turn the brightness up to 70"          = false
"how loud is it right now"              = false
