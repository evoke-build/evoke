reflex = 1

description = """
Add a note to your notes file.
The note is the text in quotes, "like this", written as one dated line at the end; nothing else in the file changes."""

not_for = [
  "reading your notes back",
  "setting a reminder for later",
  "copying text to the clipboard",
  "writing an email",
  "opening the Notes app",
]
tags = ["text"]
effect = "write"
confirm = 'Add "{text}" to your notes?'
run = "note.mts"
platforms = ["macos"]

[needs]
writes = ["{file}"]

[config]
file = "Path of the notes file, which exists"

[args.text]
ask  = "What should the note say?"
pick = "quoted"

[examples]
'note "pick up the dry cleaning"'                 = { text = "pick up the dry cleaning" }
'jot down "gate code 4417"'                       = { text = "gate code 4417" }
'add "ask Priya about the invoice" to my notes'   = { text = "ask Priya about the invoice" }
'save a note that says "renew the car insurance"' = { text = "renew the car insurance" }
'write down "the demo moved to Thursday"'         = { text = "the demo moved to Thursday" }
'add a note "call the dentist"'                   = { text = "call the dentist" }

[tests]
'put "try the new ramen place" in my notes' = { text = "try the new ramen place" }
'keep a note of "locker 31"'                = { text = "locker 31" }
"take a note"                               = { text = false }
"what did I write in my notes"              = false
"remind me to call mom at 6pm"              = false
'copy "see you soon" to the clipboard'      = false
