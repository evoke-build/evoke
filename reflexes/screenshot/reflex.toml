reflex = 1

description = """
Take a screenshot of the screen, a window or a selection.
Saved to the desktop as a PNG, or copied to the clipboard in place of what was there."""

not_for = [
  "recording a video of the screen",
  "taking a photo with the camera",
  "copying text to the clipboard",
  "printing the page",
]
tags = ["screen"]
effect = "write"
confirm = "Take a screenshot?"
run = "screenshot.mts"
platforms = ["macos"]

[needs]
writes = ["~/Desktop"]
runs   = ["screencapture"]

[args.area]
ask               = "The whole screen, a window, or a selection?"
options.screen    = "The whole screen."
options.window    = "One window, chosen by clicking it."
options.selection = "A rectangle you drag out."
optional          = true

[args.clipboard]
ask  = "To the clipboard instead of a file?"
flag = true

[yields]
path = "quoted"

[examples]
"grab a screenshot"                         = { area = false }
"screenshot the window I'm in"              = { area = "window" }
"copy a selected area of the screen"        = { area = "selection", clipboard = true }
"capture everything on screen as a png"     = { area = "screen" }
"take a screenshot"                         = { area = false }
"capture the whole screen to the clipboard" = { area = "screen", clipboard = true }

[tests]
"full screenshot please"                = { area = "screen" }
"screenshot a single window"            = { area = "window" }
"let me drag out an area to capture"    = { area = "selection" }
"a screenshot straight to my clipboard" = { area = false, clipboard = true }
"get me a screen grab"                  = { area = false }
"start recording my screen"             = false
"snap a photo of me with the camera"    = false
