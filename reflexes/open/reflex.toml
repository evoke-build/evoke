reflex = 1

description = """
Open one of your folders in Finder.
Only the folders in your places list; it shows the folder and changes nothing in it."""

not_for = [
  "opening a web site",
  "launching an app",
  "opening one file by its name",
  "downloading a file into a folder",
  "closing a folder or a window",
]
tags = ["files"]
effect = "read"
confirm = "Open {place}?"
run = ["open", "{place}"]
platforms = ["macos"]

[needs]
reads = ["{place}"]

[args.place]
ask   = "Which folder?"
vocab = "places"

[examples]
"open my documents folder"      = {}
"show me my photos folder"      = {}
"pull up the desktop in finder" = {}

[tests]
"open up the invoices folder" = {}
"browse my music folder"      = {}
"open the calculator app"     = false
"open the budget spreadsheet" = false
"go to the news site"         = false
