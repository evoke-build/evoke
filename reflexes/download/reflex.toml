reflex = 1

description = """
Download a file from a URL.
Saved into your Downloads folder or a folder you name, never over a file already there; nothing is opened or run."""

not_for = [
  "opening a web page in the browser",
  "opening the Downloads folder",
  "cloning a git repository",
  "uploading or sending a file",
]
tags = ["web", "files"]
effect = "write"
confirm = "Download {url}?"
run = "download.mts"
platforms = ["macos"]

[needs]
writes = ["{to}", "~/Downloads"]
hosts  = ["*"]

[args.url]
ask  = "Which URL?"
pick = "url"

[args.to]
ask      = "Into which folder?"
vocab    = "places"
optional = true

[yields]
path = "quoted"

[examples]
"download https://example.com/files/budget.xlsx"          = { url = "https://example.com/files/budget.xlsx" }
"save https://example.org/photos/beach.jpg to my desktop" = { url = "https://example.org/photos/beach.jpg" }
"grab the file at https://example.net/manual.pdf"         = { url = "https://example.net/manual.pdf" }

[tests]
"fetch https://example.org/slides/deck.key into my projects folder" = { url = "https://example.org/slides/deck.key" }
"pull down a copy of https://example.com/tools/setup.dmg"           = { url = "https://example.com/tools/setup.dmg" }
"download the latest invoice"                                       = { url = false }
"show https://example.com/pricing in the browser"                   = false
"what's sitting in my downloads"                                    = false
"clone https://example.com/team/tool.git"                           = false
