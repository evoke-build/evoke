reflex = 1

description = """
Empty the trash.
Everything in it is deleted for good and cannot be brought back."""

not_for = [
  "deleting or trashing one file",
  "putting a file back from the trash",
  "looking inside the trash",
  "clearing downloads or caches",
  "running the vacuum cleaner",
]
tags = ["files"]
effect = "destructive"
confirm = "Empty the trash?"
run = ["osascript", "-e", 'tell application "Finder" to empty the trash']
platforms = ["macos"]

[examples]
"clear the trash"                         = {}
"empty the recycle bin"                   = {}
"delete everything in the trash for good" = {}
"empty the trash"                         = {}
"empty the bin"                           = {}

[tests]
"empty the wastebasket"             = {}
"get rid of what's in the trash"    = {}
"delete the file called draft.txt"  = false
"put back the photo I just deleted" = false
"vacuum the living room"            = false
"clear my browser cache"            = false
