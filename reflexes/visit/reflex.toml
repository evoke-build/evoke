reflex = 1

description = """
Open one of your sites in the browser.
Only the sites in your sites list, in a private window when you ask; nothing is downloaded or changed."""

not_for = [
  "opening a folder on this machine",
  "downloading a file",
  "searching the web",
  "starting an email",
  "closing a tab or the browser",
]
tags = ["web"]
effect = "read"
confirm = "Open {site} in the browser?"
run = "visit.mts"
platforms = ["macos"]

[needs]
reads = ["~/Library/Preferences/com.apple.LaunchServices/com.apple.launchservices.secure.plist"]
runs  = ["open", "plutil"]

[args.site]
ask   = "Which site?"
vocab = "sites"

[args.incognito]
ask  = "In a private window?"
flag = true

[examples]
"pull up the docs site"             = {}
"open the news in incognito"        = { incognito = true }
"take me to my webmail"             = {}
"visit the calendar site"           = {}
"open github"                       = {}
"go to my bank in a private window" = { incognito = true }

[tests]
"bring up the wiki"                  = {}
"browse the store privately"         = { incognito = true }
"load the team dashboard"            = { incognito = false }
"go into the music folder"           = false
"search the web for standing desks"  = false
"email the landlord about the lease" = false
