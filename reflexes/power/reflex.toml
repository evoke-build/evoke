reflex = 1

description = """
Restart or shut down the laptop.
Apps are asked to quit first, as the Apple menu does; unsaved work can block it or be lost for good."""

not_for = [
  "putting the laptop to sleep",
  "locking the screen",
  "logging out",
  "turning only the display off",
  "restarting or quitting an app",
  "turning Wi-Fi off and on",
]
tags = ["power"]
effect = "destructive"
confirm = "Make the laptop {action} now?"
run = "power.mts"
platforms = ["macos"]

[needs]
runs = ["osascript"]

[args.action]
ask              = "Restart or shut down?"
options.restart  = "Reboot."
options.shutdown = "Power off."

[examples]
"restart this computer" = { action = "restart" }
"shut the laptop down"  = { action = "shutdown" }
"reboot the macbook"    = { action = "restart" }
"reboot"                = { action = "restart" }
"shut down the mac"     = { action = "shutdown" }

[tests]
"give my mac a fresh reboot"          = { action = "restart" }
"power the laptop down for the night" = { action = "shutdown" }
"press the power button for me"       = { action = false }
"let the mac doze off"                = false
"sign out of this mac"                = false
"restart the music app"               = false
"turn off just the display"           = false
"reset the router"                    = false
