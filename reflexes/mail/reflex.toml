reflex = 1

description = """
Start an email to an address in your mail app.
A subject goes in quotes, "like this"; nothing is sent until you press send."""

not_for = [
  "checking or searching the inbox",
  "replying to or forwarding an email",
  "sending a text or a chat message",
  "opening your webmail in the browser",
  "jotting down a note",
]
tags = ["mail"]
effect = "write"
confirm = "Start an email to {to}?"
run = "mail.mts"
platforms = ["macos"]

[needs]
runs = ["open"]

[args.to]
ask  = "To which email address?"
pick = "email"

[args.subject]
ask      = "What is the subject?"
pick     = "quoted"
optional = true

[examples]
"write an email to lee@example.com"                              = { to = "lee@example.com" }
'email priya@example.com about "tuesday lunch"'                  = { to = "priya@example.com", subject = "tuesday lunch" }
'start a mail to ops@example.com with the subject "server move"' = { to = "ops@example.com", subject = "server move" }

[tests]
"email jo@example.com"                                           = { to = "jo@example.com", subject = false }
'open a new email to billing@example.com titled "march invoice"' = { to = "billing@example.com", subject = "march invoice" }
"email my landlord"                                              = { to = false, subject = false }
"any new mail from the bank"                                     = false
"text ana that I'm running late"                                 = false
"reply to the last email from hr"                                = false
