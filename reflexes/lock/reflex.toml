reflex = 1

description = """
Lock the screen.
This laptop's screen only; apps keep running behind it, and your password opens it again."""

not_for = [
  "putting the laptop to sleep",
  "shutting down or restarting",
  "logging out",
  "turning only the display off",
  "locking a door",
  "locking a lost or stolen laptop",
]
tags = ["screen"]
effect = "write"
confirm = "Lock the screen?"
run = "lock.mts"
platforms = ["macos"]

[needs]
runs = ["open"]

[examples]
"lock the screen"                    = {}
"lock my laptop"                     = {}
"lock the computer while I step out" = {}

[tests]
"lock up this mac"                 = {}
"secure the screen while I'm away" = {}
"sign me out of my account"        = false
"put the mac in sleep mode"        = false
"lock the front door"              = false
