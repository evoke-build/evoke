# evoke.build: the site built by `mise run site` from docs/manual and site/, deployed to GitHub Pages on every
# change to them on main. The domain is set in the repository's Pages settings.
name: Site

on:
  push:
    branches: [main]
    paths: [docs/manual/**, site/**, assets/**, spec/schemas/**, mise-tasks/site, Cargo.toml, mise.toml, mise.lock, .github/workflows/site.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v4
        with:
          cache: true
      - run: mise run site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: target/site
      - id: deploy
        uses: actions/deploy-pages@v5
