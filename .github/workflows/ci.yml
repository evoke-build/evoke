# The two tasks every change must pass, run as on a laptop: mise installs the pinned tools, then lint and test.
# A release calls it first (release.yml), so a tag is built only from a tree that passes.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          cache: true
      - run: mise run lint
      - run: mise run test
