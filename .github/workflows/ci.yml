# The two tasks every change must pass, run as on a laptop: mise installs the pinned tools, then lint and test;
# and on macOS the flows and the collection's check, since a body's containment is the kernel's — Landlock on
# Linux, Seatbelt on macOS. A failed test step's last lines become an annotation, which the run shows without a
# login. A release calls it first (release.yml), so a tag is built only from a tree that passes.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          cache: true
      - uses: Swatinem/rust-cache@v2
      - run: mise run lint
      - run: mise run test 2>&1 | tee test.log; exit "${PIPESTATUS[0]}"
      - if: failure()
        run: python3 .github/annotate test.log

  macos:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          cache: true
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p evoke --test transcripts --test collection 2>&1 | tee test.log; exit "${PIPESTATUS[0]}"
      - if: failure()
        run: python3 .github/annotate test.log
