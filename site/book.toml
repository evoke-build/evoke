# The manual as a site, rendered by mdBook: `mise run site` copies docs/manual beside a SUMMARY.md made from its
# README, builds it here, and lays the result under target/site/manual with the landing page and install script.
[book]
title       = "evoke"
description = "The evoke manual: a sentence becomes a call of a small program, chosen by Jev and run only when it is sure enough. The CLI, the package manager and the SDK."
language    = "en"
src         = "../target/site-src"

[build]
build-dir      = "../target/site/manual"
create-missing = false

[output.html]
git-repository-url = "https://github.com/evoke-build/evoke"
edit-url-template  = "https://github.com/evoke-build/evoke/edit/main/docs/manual/{path}"
site-url           = "/manual/"
no-section-label   = true
default-theme      = "coal"
smart-punctuation  = false
additional-css     = ["manual.css"]
additional-js      = ["manual.js"]
