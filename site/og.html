<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>evoke — the card behind a shared link; rendered once to og.png</title>
  <style>
    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #101010; color: #e6e6e6;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Inter, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased; }
    .card { position: relative; width: 1200px; height: 630px; padding: 92px 104px; box-sizing: border-box; }
    .brand { display: flex; align-items: center; gap: 22px; font-size: 42px; font-weight: 650; letter-spacing: -0.02em; }
    .brand img { width: 68px; height: 68px; }
    h1 { font-size: 104px; font-weight: 700; letter-spacing: -0.045em; line-height: 0.98; margin: 62px 0 30px; }
    h1 em { font-style: normal; color: #ef7f2b; }
    p { font-size: 31px; line-height: 1.32; color: #a3a3a3; margin: 0; max-width: 920px; }
    p strong { color: #e6e6e6; font-weight: 600; }
    .url { position: absolute; right: 104px; bottom: 76px; font-size: 27px; color: #7a7a7a; letter-spacing: -0.01em; }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand"><img src="assets/logo.png" alt="">evoke</div>
    <h1>Software, <em>by reflex.</em></h1>
    <p>A sentence becomes a call of a small program, chosen by <strong>Jev</strong>, TypeSafe AI's classifier,
      and run only when it is sure enough.</p>
    <div class="url">evoke.build</div>
  </div>
</body>
</html>
