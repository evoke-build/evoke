  <script>
    // The menu on a phone: its first page takes the focus and the page beneath is out of reach while it is open;
    // Escape closes it and gives the focus back; a page chosen, a page come back to, or a window grown wide closes it.
    {
      const menu = document.querySelector("header.top .menu"), summary = menu.querySelector("summary")
      const pages = menu.nextElementSibling, own = menu.closest("body > *"), wide = matchMedia("(min-width: 48rem)")
      const shut = () => { menu.open = false }
      menu.addEventListener("toggle", () => {
        for (const part of document.body.children) if (part !== own && part.localName !== "script") part.inert = menu.open
        if (menu.open) pages.querySelector("a").focus()
      })
      addEventListener("keydown", event => { if (event.key === "Escape" && menu.open) { shut(); summary.focus() } })
      pages.addEventListener("click", event => { if (event.target.closest("a")) shut() })
      wide.addEventListener("change", () => { if (wide.matches) shut() })
      addEventListener("pageshow", event => { if (event.persisted) shut() })
    }
  </script>
