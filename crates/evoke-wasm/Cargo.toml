[package]
name                 = "evoke-wasm"
description          = "The core and the adapters as one WebAssembly module with a JSON boundary: alloc, free, call"
version.workspace    = true
edition.workspace    = true
license.workspace    = true
repository.workspace = true
publish.workspace    = true

# The cdylib is the SDK's core.wasm; the rlib is the same op table natively, which the vectors pin.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
evoke-adapters.workspace = true
evoke-core.workspace     = true
indexmap.workspace       = true
serde.workspace          = true
serde_json.workspace     = true

[lints]
workspace = true
