# A length of time, its units in seconds: the form shown for one, then for more than one, then the short forms.
[durations.units]
"3600" = ["hour", "hours", "hrs", "hr", "h"]
"60"   = ["minute", "minutes", "mins", "min", "m"]
"1"    = ["second", "seconds", "secs", "sec", "s"]

[durations.articles]
