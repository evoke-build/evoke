# English, as evoke reads it. A language is one of these files: the words each stage of the reader proposes from,
# written lower case as they are compared, each under the neutral form it stands for, the form shown first. The core
# holds no word of any language, only how a table is read; a pack proposes, and the classifier decides. The four
# built-in packs are read the same way, and nothing detects a language: a pack reads a sentence where the sentence
# shows its words.
tag  = "en"
name = "English"
# A capital letter marks a name or a code; in a language that writes every noun with one it marks nothing.
capitals_mark_names = true

# Where a request may be cut, and the words that set a part apart.
[cut]
then = [
  "and then",
  "and after that",
  "and afterwards",
  "and afterward",
  "and next",
  "then",
  "after that",
  "afterwards",
  "afterward",
  "after which",
  "next",
]
and = [
  "and also",
  "and meanwhile",
  "and in the meantime",
  "and at the same time",
  "meanwhile",
  "in the meantime",
  "at the same time",
  "and",
  "but",
  "plus",
  "as well as",
  "also",
]
signs = ["+", "&", "n", "nd", "adn"]
leads = ["and", "but", "or", "then", "also", "so", "plus"]
negation = ["not", "don't", "do not", "never", "without", "nor"]
condition = ["if", "unless", "in case"]
contrast = ["not"]
but = ["but"]
subordinators = []

# A clause before or after another, read in the words' own order, and a clause of the person's own action.
[clause]
before = ["before"]
after = ["after"]
joiner = ["then"]
subjects = ["you", "we", "i"]
tenses = ["'ve", "'d", " have", " had"]
own = ["i", "we"]
own_tenses = ["'ve", "'d", "'m", "'ll", " have", " had"]
conjunctions = ["that", "this", "which"]
heads = [
  "i need",
  "i want",
  "i'd like",
  "i would like",
  "i'd love",
  "i would love",
  "i must",
  "i have to",
  "we need",
  "we want",
  "we'd like",
  "we would like",
  "we must",
  "we have to",
]

# Politeness, which asks for nothing.
[courtesy]
words = ["please", "pls", "plz", "thanks", "thank", "you", "thx", "cheers", "ta", "kindly"]
phrases = [
  "if it's not too much trouble",
  "if it is not too much trouble",
  "if you don't mind",
  "if you do not mind",
  "if you would",
  "if possible",
  "if so",
]

# Words that point at an earlier step, or say one is done again.
[refer]
one = ["it"]
many = ["both of them", "each of them", "all of them", "the two", "them", "those", "these", "both"]
determiners = ["that", "this", "those", "these", "the", "its", "each", "every"]
weak = ["the"]
each = ["each", "every"]
adjectives = ["same", "resulting", "new"]
stop = [
