scale            = { hundred = 100, thousand = 1000 }
beyond           = ["million", "billion"]
article          = ["a", "an"]
and              = ["and"]
noughts          = ["zero", "oh"]
oh               = ["oh", "o"]
repeat           = { double = 2, triple = 3 }
half             = ["half"]
and_a_half       = ["and a half"]
compose          = "tens-ones"
joiner           = ""
years_in_pairs   = true
fused            = false
teens_after_tens = []
decimal_mark     = "."
group_mark       = ","
percent          = ["percent"]

# An ordinal: a day of the month, a place among several.
[ordinals]
words    = { first = 1, second = 2, third = 3, fourth = 4, fifth = 5, sixth = 6, seventh = 7, eighth = 8, ninth = 9, tenth = 10, eleventh = 11, twelfth = 12, twelveth = 12, thirteenth = 13, fourteenth = 14, fifteenth = 15, sixteenth = 16, seventeenth = 17, eighteenth = 18, nineteenth = 19, twentieth = 20, thirtieth = 30 }
suffixes = { "1" = "st", "2" = "nd", "3" = "rd", "11" = "th", "12" = "th", "13" = "th", other = "th" }
picks    = { first = 0, former = 0, "1st" = 0, second = 1, "2nd" = 1, third = 2, "3rd" = 2, fourth = 3, "4th" = 3, last = -1, latter = -1 }

# A day as the words say it.
[days]
every = ["every", "each"]
recurring = ["day", "week", "month", "year", "morning", "night", "evening", "weekday", "weekend"]
recurrences = ["everyday", "weekly", "daily", "monthly"]
periods = ["week", "weeks", "month", "months", "year", "years", "weekend", "fortnight"]
ahead = ["in"]
from_now = ["from now", "from today"]
the = ["the"]
of = ["of"]
day_after = ["the day after"]
noun_after = []
never = []
which_after = false
followers = [
  "at",
  "is",
  "or",
  "and",
  "this",
  "next",
  "until",
  "till",
  "from",
  "to",
  "on",
  "in",
  "fall",
  "falls",
  "come",
  "comes",
  "already",
]
leads = ["on", "for", "by", "until", "till", "from", "before", "after", "since", "of"]

[days.which]
next = ["next"]
this = ["this"]
last = ["last"]

[days.weekdays]
monday    = ["monday"]
tuesday   = ["tuesday"]
wednesday = ["wednesday"]
thursday  = ["thursday"]
friday    = ["friday"]
saturday  = ["saturday"]
sunday    = ["sunday"]

# Short forms a person types, shown for a yes.
[days.short]
monday    = ["mon"]
tuesday   = ["tue", "tues"]
wednesday = ["wed", "weds"]
thursday  = ["thu", "thur", "thurs"]
friday    = ["fri"]
saturday  = ["sat"]
sunday    = ["sun"]

# Days by their distance from today.
[days.relative]
"0"  = ["today", "tonight"]
"1"  = ["tomorrow"]
"-1" = ["yesterday"]
"2"  = ["the day after tomorrow", "day after tomorrow"]
"-2" = ["the day before yesterday"]

[days.relative_short]
"0" = ["2day", "tdy"]
"1" = ["tmrw", "tmr", "tmw", "tmrow", "2moro", "2morrow", "2mrw"]

# Lengths of days, in days.
[days.units]
"1"  = ["days", "day"]
"7"  = ["weeks", "week"]
"14" = ["fortnight"]

# The months, by number.
