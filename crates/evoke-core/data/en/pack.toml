once_more = ["too", "also", "well", "aswell", "more", "another", "again", "extra", "plus"]
again = ["same for", "as well", "aswell", "too", "also"]
clitics = []

# Words that point at a value this session returned, or count such values.
[recalled]
it      = ["it"]
one     = ["one"]
that    = ["that", "this"]
owns    = ["the", "my"]
several = ["those", "these"]
orders  = ["last", "latest", "newest", "previous", "recent", "most recent"]
