"/" = ["slash", "barre oblique"]
":" = ["deux points", "deux-points"]
"#" = ["dièse", "hashtag", "hash", "croisillon"]

# The marks around a value in quotes, and around a text in quotes.
[quotes]
value = [["«", "»"], ["“", "”"], ["‘", "’"], ["\"", "\""]]
text  = [["«", "»"], ["“", "”"], ["‘", "’"], ["\"", "\""], ["'", "'"]]

# The whole words a prompt takes for yes and for no.
[prompt]
yes = ["oui", "ouais", "ok", "d'accord", "d’accord", "yes", "yep"]
no  = ["non", "nan", "nope"]
