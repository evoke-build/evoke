# French, as evoke reads it: the words each stage of the reader proposes from, written lower case as they are compared, each under the neutral form it stands for, the form shown first. A pack reads a sentence where the sentence shows its words; the core holds no word of any language, only how a table is read.
tag  = "fr"
name = "French"
# A capital marks a name or a code, as in English.
capitals_mark_names = true

# Where a request may be cut, and the words that set a part apart.
[cut]
then = [
  "et puis",
  "puis",
  "ensuite",
  "et ensuite",
  "après",
  "et après",
  "après ça",
  "et après ça",
  "enfin",
  "et enfin",
  "pour finir",
]
and = ["et", "ainsi que", "plus", "et aussi", "aussi"]
signs = ["+", "&"]
leads = ["et", "mais", "ou", "puis", "donc", "alors", "ensuite"]
