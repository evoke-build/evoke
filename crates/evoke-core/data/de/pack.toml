  "schon",
  "dann",
  "noch",
  "statt",
  "rum",
  "mit",
  "für",
  "bei",
  "im",
  "zum",
  "bitte",
  "wieder",
  "zurück",
  "raus",
  "da",
  "fertig",
  "fällig",
  "spätestens",
  "früh",
  "abends",
  "morgens",
]
leads = ["am", "bis", "ab", "vom", "zum", "seit", "vor", "nach", "für", "den", "der"]

[days.which]
next = ["nächsten", "nächste", "nächster", "nächstes", "kommenden", "kommende", "kommender"]
this = ["diesen", "diese", "dieser", "dieses", "diesem"]
last = ["letzten", "letzte", "letzter", "letztes", "vergangenen", "vergangene", "vorigen", "vorige"]

[days.weekdays]
monday    = ["montag"]
tuesday   = ["dienstag"]
wednesday = ["mittwoch"]
thursday  = ["donnerstag"]
friday    = ["freitag"]
saturday  = ["samstag", "sonnabend"]
sunday    = ["sonntag"]

# Short forms a person types, shown for a yes: two letters, which propose only where the sentence shows German.
[days.short]
monday    = ["mo"]
tuesday   = ["di"]
wednesday = ["mi"]
thursday  = ["do"]
friday    = ["fr"]
saturday  = ["sa"]

# Days by their distance from today.
[days.relative]
"0"  = ["heute", "heut"]
"1"  = ["morgen"]
"-1" = ["gestern"]
"2"  = ["übermorgen"]
"-2" = ["vorgestern"]

[days.relative_short]
"1" = ["mrgn", "morgn"]

# Lengths of days, in days.
[days.units]
"1" = ["tage", "tagen", "tag"]
"7" = ["wochen", "woche"]

# The months, by number.
[months]
"1"  = ["januar", "jan", "jänner"]
"2"  = ["februar", "feb"]
"3"  = ["märz", "maerz", "mär", "mrz"]
"4"  = ["april", "apr"]
"5"  = ["mai"]
"6"  = ["juni", "jun"]
"7"  = ["juli", "jul"]
"8"  = ["august", "aug"]
"9"  = ["september", "sep", "sept"]
"10" = ["oktober", "okt"]
"11" = ["november", "nov"]
"12" = ["dezember", "dez"]

# A clock time: «14 Uhr» on the 24-hour clock, «halb drei» half an hour before three.
[times]
hour_cycle = 24
half_to    = ["halb"]
oclock     = ["uhr"]
at         = []
am         = ["morgens", "vormittags", "früh", "am morgen", "am vormittag", "in der früh"]
pm         = ["nachmittags", "abends", "mittags", "am nachmittag", "am abend"]
past       = ["nach"]
to         = ["vor"]

[times.named]
"12:00" = ["mittag"]
"00:00" = ["mitternacht"]

[times.minutes_past]
"15" = ["viertel nach"]

[times.minutes_to]
"15" = ["viertel vor", "dreiviertel"]

# A length of time, its units in seconds: the form shown for one, then for more than one, then the short forms.
[durations.units]
"3600" = ["stunde", "stunden", "std", "std.", "h"]
"60"   = ["minute", "minuten", "min", "min.", "m"]
"1"    = ["sekunde", "sekunden", "sek", "sek.", "s"]

[durations.articles]
"0.25" = ["eine viertel", "einer viertel", "ne viertel"]
"0.5"  = ["eine halbe", "einer halben", "einen halben", "ein halbes", "ne halbe"]
"1.5"  = ["anderthalb", "eineinhalb", "einundeinhalb"]
"1"    = ["eine", "einer", "einen", "einem", "ein", "ne", "nen", "ner"]
"2.5"  = ["zweieinhalb"]
"3.5"  = ["dreieinhalb"]
"4.5"  = ["viereinhalb"]
"0.75" = ["dreiviertel", "eine dreiviertel"]

# An amount in a currency: the symbol after the figure, «12 €».
[amounts]
symbol_after = true
symbols = { "€" = "EUR", "$" = "USD", "£" = "GBP" }
singular = ["pfund"]
codes = [
  "USD",
  "EUR",
  "GBP",
  "JPY",
  "INR",
  "CAD",
  "AUD",
  "CHF",
  "CNY",
  "SEK",
  "NOK",
  "DKK",
  "NZD",
  "MXN",
  "BRL",
  "ZAR",
  "SGD",
  "HKD",
  "KRW",
  "PLN",
  "CZK",
  "TRY",
]

[amounts.words]
EUR = ["euro", "euros"]
USD = ["dollar", "dollars"]
GBP = ["pfund"]
CHF = ["franken"]
JPY = ["yen"]

# A value said aloud: the signs by their names, and the words a code or a link is said with.
[spoken]
version  = ["v", "version"]
schemes  = ["https", "http"]
letters  = []
pronouns = ["er", "es", "du", "wo", "ja", "da", "so", "ab", "an", "am", "im", "um", "zu"]

[spoken.signs]
"@" = ["at", "ät", "klammeraffe"]
"." = ["punkt", "dot"]
"-" = ["bindestrich", "minus", "strich"]
"_" = ["unterstrich", "underscore"]
"/" = ["slash", "schrägstrich"]
":" = ["doppelpunkt"]
"#" = ["hashtag", "raute", "hash"]

# The marks around a value in quotes, and around a text in quotes.
[quotes]
value = [["„", "“"], ["»", "«"], ["«", "»"], ["‚", "‘"], ["“", "”"], ["‘", "’"], ["\"", "\""]]
text  = [["„", "“"], ["»", "«"], ["‚", "‘"], ["\"", "\""], ["«", "»"], ["'", "'"]]

# The whole words a prompt takes for yes and for no.
[prompt]
yes = ["ja", "jawohl", "jep", "jo"]
no  = ["nein", "nee", "nö"]
