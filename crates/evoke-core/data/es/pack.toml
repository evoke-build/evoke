[durations.units]
3600 = ["hora", "horas", "h", "hr", "hrs", "hs"]
60   = ["minuto", "minutos", "min", "mins", "m"]
1    = ["segundo", "segundos", "seg", "segs", "s"]

[durations.articles]
"0.25" = ["un cuarto de", "cuarto de"]
"0.5"  = ["media", "medio", "media hora de"]
"1.5"  = ["una y media", "hora y media"]
1      = ["una", "un"]
"2.5"  = ["dos y media"]
"0.75" = ["tres cuartos de"]

# An amount in a currency.
[amounts]
symbol_after = true
symbols = { "€" = "EUR", "$" = "USD", "£" = "GBP" }
singular = ["libra"]
codes = [
  "USD",
  "EUR",
  "GBP",
  "JPY",
  "INR",
  "CAD",
  "AUD",
  "CHF",
  "CNY",
  "SEK",
  "NOK",
  "DKK",
  "NZD",
  "MXN",
  "BRL",
  "ZAR",
  "SGD",
  "HKD",
  "KRW",
  "PLN",
  "CZK",
  "TRY",
]

[amounts.words]
EUR = ["euro", "euros", "eur", "pavos"]
USD = ["dólar", "dólares", "dolar", "dolares"]
GBP = ["libra", "libras", "libra esterlina", "libras esterlinas"]
CHF = ["franco", "francos", "franco suizo", "francos suizos"]
JPY = ["yen", "yenes"]
MXN = ["peso", "pesos", "peso mexicano", "pesos mexicanos"]

# A value said aloud: the signs by their names, and the words a code or a link is said with.
[spoken]
version = ["v", "version", "versión"]
schemes = ["https", "http"]
letters = []
pronouns = [
  "él",
  "yo",
  "tú",
  "tu",
  "o",
  "u",
  "y",
  "e",
  "a",
  "al",
  "el",
  "la",
  "lo",
  "le",
  "en",
  "un",
  "se",
  "si",
  "sí",
  "ya",
  "no",
  "me",
  "te",
  "mi",
]

[spoken.signs]
"@" = ["arroba", "at"]
"." = ["punto"]
-   = ["guion", "guión", "menos", "raya"]
_   = ["guion bajo", "guión bajo", "underscore"]
"/" = ["barra", "slash"]
":" = ["dos puntos"]
"#" = ["almohadilla", "numeral", "hashtag", "hash"]

# The marks around a value in quotes, and around a text in quotes.
[quotes]
value = [["«", "»"], ["“", "”"], ["‘", "’"], ["\"", "\""]]
text  = [["«", "»"], ["“", "”"], ["‘", "’"], ["\"", "\""], ["'", "'"]]

# The whole words a prompt takes for yes and for no.
[prompt]
yes = ["sí", "si", "vale", "ok", "dale", "claro", "yes"]
no  = ["no", "nop", "nope", "nel"]
