# TOML formatting and checks, run by: bin/dx mise run lint. The files named here and no other: a personal override
# such as mise.local.toml is left alone.
include = [
  ".taplo.toml",
  "Cargo.toml",
  "crates/**/*.toml",
  "deny.toml",
  "mise.toml",
  "reflexes/*/reflex.toml",
  "ruff.toml",
  "site/book.toml",
  "spec/**/*.toml",
]

[formatting]
align_entries = true
column_width  = 120

# The schemas of spec/schemas/ validate the seeds and every fixture — but one manifest that must not read, the
# tree the update transcript skips.
[[rule]]
include = ["reflexes/*/reflex.toml", "spec/**/reflex.toml"]
exclude = ["spec/transcripts/update/remote/radhi/tools/1.1.0/clock/reflex.toml"]
[rule.schema]
path = "spec/schemas/reflex.json"

[[rule]]
include = ["spec/**/overlays/*.toml"]
[rule.schema]
path = "spec/schemas/overlay.json"

[[rule]]
include = ["spec/**/vocab/*.toml"]
[rule.schema]
path = "spec/schemas/vocabulary.json"

[[rule]]
include = ["spec/**/evoke.toml"]
[rule.schema]
path = "spec/schemas/evoke.json"
