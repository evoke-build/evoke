# The fuzz targets, outside the workspace: libFuzzer through cargo-fuzz, run by `mise run fuzz`, never by CI.
[package]
name    = "evoke-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
evoke-core    = { path = "../crates/evoke-core" }
libfuzzer-sys = "0.4.10"
serde_json    = "1.0.149"

# The manifest reader on raw bytes: every manifest the vectors and the collection hold seeds the corpus.
[[bin]]
name  = "manifest"
path  = "fuzz_targets/manifest.rs"
test  = false
doc   = false
bench = false

# The weave's reading on raw bytes: every weave vector's and fixture's request and the weave flows' sentences seed it.
[[bin]]
name  = "reading"
path  = "fuzz_targets/reading.rs"
test  = false
doc   = false
bench = false

# The `date` recognizer on raw bytes: every candidate re-reads whole through `picked`, bounded, and no two candidates overlap.
[[bin]]
name  = "date"
path  = "fuzz_targets/date.rs"
test  = false
doc   = false
bench = false

# The `time` recognizer on raw bytes: every candidate re-reads whole through `picked`, bounded, and no two candidates overlap.
[[bin]]
name  = "time"
path  = "fuzz_targets/time.rs"
test  = false
doc   = false
bench = false

# The `amount` recognizer on raw bytes: every candidate re-reads whole through `picked`, bounded, and no two candidates overlap.
[[bin]]
name  = "amount"
path  = "fuzz_targets/amount.rs"
test  = false
doc   = false
bench = false

# The `code` recognizer on raw bytes: every candidate re-reads whole through `picked`, bounded, and no two candidates overlap.
[[bin]]
name  = "code"
path  = "fuzz_targets/code.rs"
test  = false
doc   = false
bench = false
